<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URAKAO - Iniciar Sesión</title>
    <style>
        /* ============================================================
           URAKAO — Estilos globales compartidos
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Paleta oficial URAKAO — Manual de Marca */
            --cafe-oscuro:  #432818;
            --cafe-medio:   #5D3A1A;
            --crema:        #ECE8DB;
            --verde:        #8BA040;
            --rojo:         #BC4749;
            --ocre:         #BC4749;
            --blanco-opaco: #F5F2EC;
            --beige:        #ECE8DB;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Georgia', serif;
            color: var(--cafe-oscuro);
            background-color: var(--blanco-opaco);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--cafe-medio);
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--beige);
            background: white;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            color: var(--cafe-oscuro);
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--ocre);
        }

        .auth-error {
            background: #fdecea;
            color: #c62828;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            border-left: 3px solid #c62828;
        }

        .auth-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            border-left: 3px solid #2e7d32;
        }

        .hidden { display: none !important; }

        /* ============================================================
           URAKAO — Estilos de autenticación con Google
           ============================================================ */

        .auth-page {
            min-height: 100vh;
            background: linear-gradient(160deg, var(--beige) 0%, var(--blanco-opaco) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .auth-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('/Fotos de Urakao Oficial/URAKAO PATRONES-05.png');
            background-size: 300px;
            opacity: 0.04;
            z-index: 0;
        }

        .auth-container { position: relative; z-index: 1; }

        .auth-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-brand {
            margin-bottom: 2rem;
        }

        .auth-brand img {
            height: 70px;
            width: auto;
            object-fit: contain;
            background: var(--cafe-oscuro);
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }

        .auth-brand-sub {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--ocre);
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border: 1px solid var(--beige);
        }

        .auth-card h2 {
            font-size: 1.8rem;
            color: var(--cafe-oscuro);
            letter-spacing: 2px;
            margin-bottom: 0.4rem;
        }

        .auth-subtitle {
            color: var(--cafe-medio);
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 2rem;
        }

        /* Botón Google */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.9rem 1.5rem;
            background: white;
            border: 2px solid var(--beige);
            font-family: 'Georgia', serif;
            font-size: 1rem;
            color: var(--cafe-oscuro);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-google:hover:not(:disabled) {
            border-color: var(--ocre);
            background: var(--blanco-opaco);
            box-shadow: 0 4px 15px rgba(196, 149, 108, 0.2);
        }

        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-divider {
            margin: 1.5rem 0;
            position: relative;
        }

        .auth-divider span {
            font-size: 0.78rem;
            color: var(--cafe-medio);
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .auth-note {
            font-size: 0.78rem;
            color: var(--cafe-medio);
            line-height: 1.6;
            opacity: 0.7;
            margin-top: 1.5rem;
        }

        .auth-back {
            margin-top: 1.5rem;
        }

        .auth-back a {
            color: var(--cafe-medio);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .auth-back a:hover {
            color: var(--ocre);
        }

        .auth-error {
            background: #fdecea;
            color: #c62828;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid #c62828;
            text-align: left;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-brand">
            <a href="/">
                <img src="/Fotos de Urakao Oficial/LOGOS color hueso.png" alt="URAKAO">
            </a>
            <p class="auth-brand-sub">Chocolatería Artesanal · Urabá</p>
        </div>

        <div class="auth-card">
            <h2>Bienvenido</h2>
            <p class="auth-subtitle">Inicia sesión para hacer tu pedido a domicilio</p>

            <div id="login-error" class="auth-error hidden"></div>

            <button id="btn-google" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Continuar con Google
            </button>

            <div class="auth-divider">
                <span>Acceso seguro con tu cuenta Google</span>
            </div>

            <p class="auth-note">
                Al continuar, aceptas recibir actualizaciones de tu pedido.<br>
                Tus datos están protegidos por Firebase Auth.
            </p>
        </div>

        <p class="auth-back">
            <a href="/">← Volver a la página principal</a>
        </p>
    </div>

    <script type="module" src="/src/js/firebase.js"></script>
    <script type="module" src="/src/js/auth.js"></script>
</body>
</html>
